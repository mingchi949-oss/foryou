<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower Background With Photo</title>
    <link rel="stylesheet" href="./styleV3.css" />
  </head>

  <body>
    <div class="box">
      <h2>Why You So Cute Baby</h2>
      <h3>See the favorite</h3>
      <img id="userPhoto" src="" alt="Your Photo" />

      <label for="fileInput" class="upload-btn">Upload Photo</label>
      <input id="fileInput" type="file" accept="image/*" />
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const userPhoto = document.getElementById("userPhoto");

      fileInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => (userPhoto.src = e.target.result);
        reader.readAsDataURL(file);
      });
    </script>
  </body>
</html>
